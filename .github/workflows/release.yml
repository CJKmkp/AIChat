name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: InkCanvasForClass/community/.github/workflows/plugin-build.yml@net6
    with:
      project: AIChat.csproj
      plugin_id: com.icc.ai-chat
      plugin_name: AI 助手
      plugin_description: '独立悬浮 AI 聊天助手，支持 OpenAI 兼容与 Claude 原生协议，回答可一键插入画布。'
      create_release: true
      release_tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
